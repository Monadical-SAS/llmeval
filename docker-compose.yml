services:
  llmeval:
    # Build from local Dockerfile
    build:
      context: .
      dockerfile: Dockerfile

    # Privileged mode is required for podman-in-docker and systemd
    # This allows the container to run nested containers for LLM evaluations
    # Required for cgroup v2 support, nested container execution, and systemd as PID 1
    privileged: true

    # Use host cgroup namespace to avoid issues with systemd
    # This is required for systemd to properly manage cgroups
    cgroup: host

    # Systemd requires these tmpfs mounts for proper operation
    # Note: /run should NOT be tmpfs - systemd manages it
    # Note: /tmp should NOT be tmpfs - podman containers need persistent temp files
    tmpfs:
      - /run/lock
    # Port mapping: host:container
    # Map host port 8080 to container port 80 (nginx)
    #ports:
    #  - "8080:80"

    # Volume mounts - simplified to only essential shared storage
    volumes:
      # Persistent evaluation results - survives container restarts
      - ./runs:/app/runs

      # Podman storage volume for container images
      # This persists the cubbi opencode image between container restarts
      - podman-storage:/var/lib/containers/storage

      # Mount cgroup for systemd (read-write for proper delegation)
      - /sys/fs/cgroup:/sys/fs/cgroup:rw

    # Environment variables for API keys and configuration
    environment:
      # LiteLLM API key for accessing LLM providers
      # Set this in your .env file or pass directly
      - LITELLM_BASE_URL=${LITELLM_BASE_URL:-}
      - LITELLM_API_KEY=${LITELLM_API_KEY:-}

      # OpenRouter API key for accessing models via OpenRouter
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}

      # Timezone for correct cron scheduling (Central Standard Time)
      - TZ=America/Chicago

      # Cron schedule (default: 12:00 CST daily)
      # Format: minute hour day month weekday
      - CRON_SCHEDULE=${CRON_SCHEDULE:-0 12 * * *}

      # Models to evaluate (comma-separated)
      # Example: litellm/openrouter/anthropic/claude-sonnet-4,litellm/openrouter/openai/gpt-4
      - EVAL_MODELS=${EVAL_MODELS:-litellm/openrouter/anthropic/claude-sonnet-4,litellm/openrouter/openai/gpt-4}

      # Tasks to run (comma-separated paths relative to /app/)
      # Example: tasks/task1_file_list,tasks/task2_fix_python_syntax
      - EVAL_TASKS=${EVAL_TASKS:-tasks/task1_file_list}

    # Restart policy: restart unless explicitly stopped
    # This ensures the service recovers from crashes automatically
    restart: unless-stopped

# Named volumes for persistent data
volumes:
  # Podman storage for container images
  # This prevents re-downloading the cubbi opencode image on every restart
  podman-storage:
    driver: local
